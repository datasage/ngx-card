name: Compat Matrix

# Tests @datasage/ngx-card against released Angular major versions by
# scaffolding a fresh app at each major, installing the published library
# (with --legacy-peer-deps to bypass narrow peer-dep ranges), and running
# a production build.
#
# Two distinct signals come out of each cell:
#   - Notice "Peer dep OK"     -> library installs cleanly, peer dep range
#                                 already permits this version. No action.
#   - Warning "Peer dep narrow"-> install would fail without --legacy-peer-deps,
#                                 but the build still succeeded. Widen the
#                                 library's peerDependencies to include this
#                                 Angular major, ship a patch release.
#   - Cell failed              -> code-level incompatibility. Investigate;
#                                 may indicate the floor needs to rise (cut
#                                 a new library major).
#
# This is BUILD-TIME compat only. Runtime regressions need a real smoke
# test (Karma/Cypress/Vitest), deferred to a future Angular version.
#
# Runs weekly on a schedule. Dispatch manually after a new Angular major
# release; add a new row to the matrix below to extend coverage.
#
# Each matrix cell pairs an Angular major with a Node version that
# satisfies that Angular CLI's engines.node range:
#   - Angular 14-16 -> Node 18
#   - Angular 17-19 -> Node 20
#   - Angular 20+   -> Node 22
#
# Auth: GITHUB_TOKEN (auto-provided) for installing the scoped package
# from GitHub Packages.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - angular: '14'
            node: '18'
          - angular: '15'
            node: '18'
          - angular: '16'
            node: '18'
          - angular: '17'
            node: '20'
          - angular: '18'
            node: '20'
          - angular: '19'
            node: '20'
          - angular: '20'
            node: '22'
          - angular: '21'
            node: '22'
    name: Angular ${{ matrix.angular }} (Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}.x
          registry-url: 'https://npm.pkg.github.com'
          scope: '@datasage'

      - name: Run compat test
        run: bash compat/test.sh ${{ matrix.angular }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
